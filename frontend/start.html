<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monster Café | 初始界面</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="title-screen">
  <main class="title-menu">
    <h1 class="game-title-art">Monster Café</h1>
    <div class="title-actions">
      <a class="button title-button" href="saves.html">开始游戏</a>
      <button class="button title-button danger-button" type="button" data-open-exit-game>退出游戏</button>
    </div>
  </main>

  <div class="modal-backdrop" data-exit-game-modal hidden>
    <section class="day-modal pause-modal" role="dialog" aria-modal="true">
      <h2>是否要退出游戏？</h2>
      <p class="lead">选择“是”会尝试关闭当前网页窗口。</p>
      <div class="modal-actions">
        <button class="button danger-button" type="button" data-confirm-exit-game>是</button>
        <button class="button" type="button" data-cancel-exit-game>否</button>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
